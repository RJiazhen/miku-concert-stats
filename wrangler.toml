# Nitro's cloudflare-module preset writes .output/server/wrangler.json and
# overrides main/assets. Deploy with: pnpm exec wrangler --cwd .output deploy
name = "miku-concert-stats"
compatibility_date = "2026-10-06"
compatibility_flags = ["nodejs_compat"]

# Error reports from the floating feedback widget.
# Created with: pnpm exec wrangler kv namespace create FEEDBACK
# Local `nuxt dev` keeps the binding out of the request context, so the widget
# shows the "反馈服务暂不可用" fallback there instead of writing to a local KV.
[[kv_namespaces]]
binding = "FEEDBACK"
id = "777b49ffd2744f12a54fc3611ff791e9"

# Cloudflare Access application that gates the hidden ops backend
# (/ops/feedback-inbox and every /api/feedback admin route).
# Read both values from Zero Trust > Access > Applications after creating the
# self-hosted application for the Worker hostname:
#   ACCESS_TEAM_DOMAIN: team domain, e.g. example.cloudflareaccess.com (no scheme)
#   ACCESS_AUD:         the application's Audience (AUD) tag
# While either value is an empty string the Worker rejects every admin feedback
# API with 401 and returns no feedback payload at all, so an unconfigured deploy
# leaks nothing. The public GET / and POST /api/feedback paths stay unprotected.
# Created 2026-11-04: self-hosted app "miku-concert-stats feedback admin" with
# destinations for /ops, /ops/*, /api/feedback/list, /api/feedback/status, and
# /api/feedback/* (never a bare /api/feedback*), policy `my-cloudflare-account`.
[vars]
ACCESS_TEAM_DOMAIN = "summer-thunder-62e1.cloudflareaccess.com"
ACCESS_AUD = "87de2159d583fb4b7536e98227178ba3150fc953ef3a3f817e2f8334cdd00e4b"
