name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:catalog
      - run: pnpm derive:setlists --check
      - run: pnpm locations --check
      - run: pnpm report:setlist --check
      - run: pnpm report:setlist-review --check
      - run: pnpm report:producers --check
